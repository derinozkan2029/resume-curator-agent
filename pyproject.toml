[project]
name = "resume-curator-agent"
version = "0.1.0"
description = "LangGraph agent that scores job fit, then tailors a one-page resume and cover letter."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.3.17",
    "langchain-anthropic>=1.6.1",
    "langgraph>=1.2.11",
    "markdown>=3.10.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]
